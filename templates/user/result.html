<style>
/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* =========================
   BODY
========================= */
body{
    background:
    radial-gradient(circle at top right, rgba(245,158,11,.12), transparent 30%),
    linear-gradient(135deg,#0f172a,#1e293b);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;
}

/* =========================
   RESULT PAGE
========================= */
.result-page{
    width:100%;
    max-width:1400px;
}

/* =========================
   RESULT CONTAINER
========================= */
.result-container{
    width:100%;
    height:600px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    border-radius:36px;

    padding:45px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:0 25px 60px rgba(0,0,0,.18);

    overflow:hidden;
}

/* =========================
   HEADER
========================= */
.result-header{
    text-align:center;

    margin-bottom:25px;
}

/* TAG */
.result-header span{
    display:inline-block;

    padding:10px 20px;

    border-radius:40px;

    background:rgba(255,255,255,.08);

    color:#fff;

    font-size:13px;
    font-weight:600;

    margin-bottom:18px;
}

/* TITLE */
.result-header h1{
    font-size:48px;

    color:#fff;

    margin-bottom:12px;
}

/* SUBTITLE */
.result-header p{
    color:#cbd5e1;

    font-size:16px;
}

/* =========================
   RESULT GRID
========================= */
.result-grid{
    flex:1;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:30px;

    align-items:center;
}

/* =========================
   CARD
========================= */
.result-card{
    height:260px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    border-radius:28px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    transition:.3s;
}

/* HOVER */
.result-card:hover{
    transform:translateY(-6px);

    background:rgba(255,255,255,.12);

    box-shadow:0 20px 35px rgba(0,0,0,.15);
}

/* ICON */
.result-icon{
    font-size:46px;

    margin-bottom:20px;
}

/* NUMBER */
.result-card h2{
    font-size:54px;

    color:#fff;

    margin-bottom:12px;
}

/* TEXT */
.result-card p{
    color:#cbd5e1;

    font-size:17px;
}

/* =========================
   BUTTON AREA
========================= */
.result-btn-area{
    text-align:center;

    margin-top:20px;
}

/* BUTTON */
.home-btn{
    display:inline-flex;
    justify-content:center;
    align-items:center;

    padding:16px 40px;

    border-radius:18px;

    background:linear-gradient(135deg,#d97706,#f59e0b);

    color:#fff;

    text-decoration:none;

    font-size:16px;
    font-weight:600;

    transition:.3s;
}

/* HOVER */
.home-btn:hover{
    transform:translateY(-4px);

    box-shadow:0 18px 30px rgba(217,119,6,.25);
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:992px){

    body{
        overflow:auto;
    }

    .result-container{
        height:auto;
    }

    .result-grid{
        grid-template-columns:1fr;
    }

    .result-card{
        height:220px;
    }

}

@media(max-width:768px){

    .result-container{
        padding:25px;
    }

    .result-header h1{
        font-size:34px;
        line-height:1.4;
    }

}
</style>


<section class="result-page">

    <div class="result-container">

        <!-- TOP -->
        <div class="result-header">

            <span>TEST RESULT</span>

            <h1>
                Python Aptitude Test Result 🎉
            </h1>

            <p>
                Here is your complete test performance summary.
            </p>

        </div>

        <!-- RESULT CARDS -->
        <div class="result-grid">

            <!-- TOTAL MARKS -->
            <div class="result-card">
                <div class="result-icon">🏆</div>

                <h2>{{ total_marks }}</h2>

                <p>Total Marks</p>
            </div>

            <!-- CORRECT -->
            <div class="result-card">
                <div class="result-icon">✅</div>

                <h2>{{ correct_answers }}</h2>

                <p>Correct Answers</p>
            </div>

            <!-- WRONG -->
            <div class="result-card">
                <div class="result-icon">❌</div>

                <h2>{{ wrong_answers }}</h2>

                <p>Wrong Answers</p>
            </div>

           

        </div>

        <!-- BUTTON -->
        <div class="result-btn-area">

            <a href="/appti_profile/" class="home-btn">
                Back To Home
            </a>

        </div>

    </div>

</section>
