<style>
    /* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
}

/* =========================
   LOGIN PAGE
========================= */
.user-login-page{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    background:
    radial-gradient(circle at top right, rgba(245,158,11,.12), transparent 30%),
    linear-gradient(135deg,#0f172a,#1e293b);

    overflow:hidden;
}

/* =========================
   LOGIN BOX
========================= */
.login-box{
    width:100%;
    max-width:480px;

    background:rgba(255,255,255,.96);

    padding:45px;
    border-radius:30px;

    box-shadow:0 30px 60px rgba(0,0,0,.25);

    animation:floatBox 4s ease-in-out infinite;
}

/* =========================
   HEADER
========================= */
.login-header{
    text-align:center;
    margin-bottom:35px;
}

.login-header span{
    display:inline-block;
    padding:10px 18px;
    border-radius:40px;

    background:rgba(245,158,11,.12);
    color:#d97706;

    font-size:13px;
    font-weight:600;

    margin-bottom:18px;
}

.login-header h1{
    font-size:38px;
    color:#0f172a;
    margin-bottom:12px;
}

.login-header p{
    color:#64748b;
    line-height:1.7;
    font-size:15px;
}

/* =========================
   FORM
========================= */
.login-form{
    display:flex;
    flex-direction:column;
    gap:22px;
}

/* FORM GROUP */
.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#334155;
}

/* INPUT */
.form-group input{
    width:100%;
    padding:16px 18px;

    border:1px solid #e2e8f0;
    border-radius:14px;

    background:#f8fafc;

    outline:none;
    transition:.3s;

    font-size:14px;
}

.form-group input:focus{
    border-color:#f59e0b;
    background:#fff;
    box-shadow:0 0 0 4px rgba(245,158,11,.12);
}

/* =========================
   OPTIONS
========================= */
.login-options{
    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:14px;
    color:#475569;
}

.login-options label{
    display:flex;
    align-items:center;
    gap:8px;
}

.login-options a{
    text-decoration:none;
    color:#d97706;
    font-weight:500;
}

/* =========================
   BUTTON
========================= */
.login-form button{
    width:100%;

    padding:17px;

    border:none;
    border-radius:16px;

    background:linear-gradient(135deg,#d97706,#f59e0b);

    color:#fff;
    font-size:16px;
    font-weight:600;

    cursor:pointer;
    transition:.3s;
}

.login-form button:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 30px rgba(217,119,6,.25);
}

/* =========================
   REGISTER LINK
========================= */
.register-link{
    text-align:center;
    margin-top:25px;

    color:#475569;
    font-size:14px;
}

.register-link a{
    text-decoration:none;
    color:#d97706;
    font-weight:600;
}

/* =========================
   ANIMATION
========================= */
@keyframes floatBox{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:576px){

    .login-box{
        padding:30px 24px;
    }

    .login-header h1{
        font-size:30px;
    }
}
</style>

<section class="user-login-page">

    <div class="login-box">

        <div class="login-header">
            <span>MR DATAFORGE</span>
            <h1>User Login</h1>
            <p>
                Login with your registered email and password
                to access the Python Aptitude Test Portal.
            </p>
        </div>

        <form class="login-form" action="/apti_login/" method="post">
            {% csrf_token %}    

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit">
                Login Now
            </button>

        </form>

        <div class="register-link">
            Don’t have an account?
            <a href="/apptitude_test/">Register Here</a>
        </div>

    </div>

</section>
