<style>
    /* =========================
   QUESTION GRID
========================= */
.questions-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:25px;
}

/* QUESTION BOX */
.question-box{
    background:#f8fafc;

    border:2px solid #e2e8f0;
    border-radius:24px;

    padding:25px;

    transition:.3s;
}

.question-box:hover{
    border-color:#f59e0b;

    transform:translateY(-4px);

    box-shadow:0 15px 30px rgba(0,0,0,.06);
}

/* QUESTION NUMBER */
.question-number-box{
    display:inline-block;

    padding:8px 16px;

    border-radius:40px;

    background:#fff7ed;
    color:#d97706;

    font-size:13px;
    font-weight:600;

    margin-bottom:18px;
}

/* TITLE */
.question-title{
    font-size:24px;

    line-height:1.5;

    margin-bottom:25px;

    color:#0f172a;
}

/* OPTIONS */
.options-container{
    display:flex;
    flex-direction:column;
    gap:14px;
}

/* OPTION */
.option-item{
    display:flex;
    align-items:center;
    gap:14px;

    padding:16px 18px;

    border:2px solid #e2e8f0;
    border-radius:16px;

    background:#fff;

    cursor:pointer;

    transition:.3s;
}

.option-item:hover{
    border-color:#f59e0b;
    background:#fff7ed;
}

/* RADIO */
.option-item input{
    width:20px;
    height:20px;

    accent-color:#f59e0b;
}

/* TEXT */
.option-item span{
    font-size:15px;
    color:#334155;
}

/* SUBMIT */
.submit-btn{
    width:100%;

    padding:18px;

    border:none;
    border-radius:18px;

    background:linear-gradient(135deg,#d97706,#f59e0b);

    color:#fff;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    margin-top:30px;

    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px);

    box-shadow:0 15px 25px rgba(217,119,6,.25);
}

/* RESPONSIVE */
@media(max-width:900px){

    .questions-grid{
        grid-template-columns:1fr;
    }

}
/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f1f5f9;

    display:flex;

    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */
.test-sidebar{
    width:280px;

    background:#0f172a;

    padding:30px 20px;

    position:fixed;

    left:0;
    top:0;

    height:100vh;
}

/* LOGO */
.sidebar-logo{
    text-align:center;

    margin-bottom:40px;
}

.sidebar-logo h2{
    color:#fff;

    font-size:28px;
}

/* MENU */
.sidebar-menu{
    list-style:none;
}

.sidebar-menu li{
    margin-bottom:15px;
}

/* LINKS */
.sidebar-menu li a{
    display:flex;
    align-items:center;

    padding:16px 20px;

    border-radius:16px;

    color:#cbd5e1;

    text-decoration:none;

    transition:.3s;
}

/* ACTIVE */
.sidebar-menu li.active a,
.sidebar-menu li a:hover{
    background:linear-gradient(135deg,#d97706,#f59e0b);

    color:#fff;

    transform:translateX(5px);
}

/* =========================
   MAIN CONTENT
========================= */
.main-content{
    margin-left:280px;

    width:calc(100% - 280px);

    padding:30px;
}

/* =========================
   HEADER
========================= */
.top-header{
    background:#fff;

    border-radius:24px;

    padding:24px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:30px;

    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

/* TITLE */
.header-left h1{
    font-size:34px;

    color:#0f172a;

    margin-bottom:8px;
}

.header-left p{
    color:#64748b;
}

/* RIGHT */
.header-right{
    display:flex;
    align-items:center;

    gap:20px;
}

/* TIMER */
.timer-box{
    padding:14px 24px;

    border-radius:16px;

    background:linear-gradient(135deg,#d97706,#f59e0b);

    color:#fff;

    font-weight:700;
}

/* PROFILE */
.profile-box{
    display:flex;
    align-items:center;

    gap:12px;

    background:#f8fafc;

    padding:10px 18px;

    border-radius:16px;
}

.profile-box img{
    width:45px;
    height:45px;

    border-radius:50%;
}

/* =========================
   FOOTER
========================= */
.test-footer{
    margin-top:40px;

    text-align:center;

    padding:20px;

    color:#64748b;
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:992px){

    .test-sidebar{
        width:100%;

        height:auto;

        position:relative;
    }

    body{
        flex-direction:column;
    }

    .main-content{
        margin-left:0;

        width:100%;
    }

}

@media(max-width:768px){

    .top-header{
        flex-direction:column;
        gap:20px;

        text-align:center;
    }

}
/* =========================
   ATTEMPT CARD
========================= */
.attempt-card{
    width:100%;

    max-width:420px;

    background:linear-gradient(135deg,#d97706,#f59e0b);

    border-radius:28px;

    padding:30px;

    margin-top:20px;

    display:flex;
    align-items:center;

    gap:24px;

    box-shadow:0 20px 40px rgba(217,119,6,.25);

    position:relative;

    overflow:hidden;
}

/* GLOW EFFECT */
.attempt-card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    background:rgba(255,255,255,.12);

    border-radius:50%;

    top:-70px;
    right:-70px;
}

/* ICON */
.attempt-icon{
    width:85px;
    height:85px;

    min-width:85px;

    border-radius:24px;

    background:rgba(255,255,255,.15);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:38px;

    backdrop-filter:blur(10px);
}

/* CONTENT */
.attempt-content h2{
    font-size:48px;

    color:#fff;

    margin-bottom:8px;

    line-height:1;
}

.attempt-content p{
    color:#fff7ed;

    font-size:16px;

    font-weight:500;
}

/* HOVER */
.attempt-card:hover{
    transform:translateY(-5px);

    transition:.3s;
}

/* RESPONSIVE */
@media(max-width:768px){

    .attempt-card{
        max-width:100%;
    }

    .attempt-content h2{
        font-size:38px;
    }

}
</style>
<!-- =========================
     SIDEBAR
========================= -->
<aside class="test-sidebar">

    <div class="sidebar-logo">
        <h2>MR DATAFORGE</h2>
    </div>

    <ul class="sidebar-menu">

        <li class="active">
            <a href="/appti_profile/">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="/test/">
                📝 Aptitude Test
            </a>
        </li>

        <li>
            <a href="/show_results/">
                📊 Results
            </a>
        </li>

      

        <li>
            <a href="/apti_logout/">
                🚪 Logout
            </a>
        </li>

    </ul>

</aside>

<!-- =========================
     MAIN CONTENT
========================= -->
<div class="main-content">

    <!-- HEADER -->
    <header class="top-header">

        <div class="header-left">

            <h1>
                Python Aptitude Test
            </h1>

            <p>
                Welcome Back 👋
            </p>

        </div>

        <div class="header-right">

            

            <div class="profile-box">

                <img
                src="/{{ profile.photo }}">

                <span>
                    {{ profile.name }}
                </span>

            </div>

        </div>

    </header>

   <!-- =========================
     ATTEMPT CARD
========================= -->
<div class="attempt-card">

    <div class="attempt-icon">
        📊
    </div>

    <div class="attempt-content">

        <h2>
            {{ profile.total_attempts }}
        </h2>

        <p>
            Total Test Attempts
        </p>

    </div>

</div>
   

    <!-- FOOTER -->
    <footer class="test-footer">

        <p>
            © 2026 MR DATAFORGE |
            Python Aptitude Platform
        </p>

    </footer>

</div>
