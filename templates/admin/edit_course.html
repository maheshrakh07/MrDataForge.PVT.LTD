<style>
   /* FORM CONTAINER */
form{
    width:100%;
    max-width:100%;
    height:500px;
    margin:30px 0;
    background:#fff;
    padding:30px;
    border-radius:24px;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    border:1px solid #edf2f7;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

    overflow-y:auto;
}

/* FORM GROUP */
.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:0;
}

/* FULL WIDTH FIELD */
.form-group.full-width{
    grid-column:1 / -1;
}

/* LABEL */
.form-group label{
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:8px;
}

/* INPUTS */
.form-group input,
.form-group textarea{
    width:100%;
    padding:14px 16px;
    border:1px solid #e2e8f0;
    border-radius:14px;
    background:#f8fafc;
    outline:none;
    transition:.3s;
}

/* FOCUS */
.form-group input:focus,
.form-group textarea:focus{
    border-color:#d97706;
    background:#fff;
    box-shadow:0 0 0 4px rgba(217,119,6,.08);
}

/* TEXTAREA */
.form-group textarea{
    min-height:30px;
    resize:vertical;
}

/* BUTTON */
.btn-primary{
    grid-column:1 / -1;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#d97706,#f59e0b);
    color:#fff;
    font-weight:600;
    cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:1200px){
    form{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:768px){
    form{
        grid-template-columns:1fr;
        height:auto;
    }
}
</style>


      <form action="{% url 'edit_course' course.id %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
          <label for="course_name">Course Name</label>
          <input type="text" id="course_name" name="course_name" value="{{ course.name }}" required>
        </div>
        <div class="form-group">
          <label for="course_description">Description</label>
          <textarea id="course_description" name="course_description">{{ course.description }}</textarea>
        </div>
        
        <div class="form-group">
          <label for="course_price">Price</label>
          <input type="number" id="course_price" name="course_price" value="{{ course.price }}" required>
        </div>
    
        <div class="form-group">
          <label for="course_duration">Duration (in months)</label>
          <input type="number" id="course_duration" name="course_duration" value="{{ course.duration }}" required>
        </div>
        
        <div class="form-group">
          <label for="course_image">Course Image </label>
          <input type="file" id="course_image" name="course_image">
        </div>
        
        <div class="form-group">
          <label for="course_key_points">Key Points 1 </label>
          <input type="text" id="course_key_points" name="key_point_1" value="{{ course.key_point_1 }}">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 2 </label>
          <input type="text" id="course_key_points" name="key_point_2" value="{{ course.key_point_2 }}">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 3 </label>
          <input type="text" id="course_key_points" name="key_point_3" value="{{ course.key_point_3 }}">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 4 </label>
          <input type="text" id="course_key_points" name="key_point_4" value="{{ course.key_point_4 }}">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 5 </label>
          <input type="text" id="course_key_points" name="key_point_5" value="{{ course.key_point_5 }}">
        </div>
        <button type="submit" class="btn btn-primary">Update Course</button>
      </form>
