
<style> 
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
}

/* PAGE */
.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

/* CONTAINER */
.login-container{
    width:100%;
    max-width:1200px;
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* LEFT */
.login-left{
    background:linear-gradient(135deg,#d97706,#92400e);
    color:#fff;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.login-left h1{
    font-size:42px;
    margin-bottom:20px;
}

.login-left p{
    line-height:1.8;
    margin-bottom:30px;
    opacity:.95;
}

.login-left img{
    width:100%;
    border-radius:20px;
    object-fit:cover;
}

/* RIGHT */
.login-right{
    padding:60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* FORM */
.login-form{
    width:100%;
    max-width:400px;
}

.login-form h2{
    font-size:32px;
    margin-bottom:30px;
    color:#0f172a;
}

/* FORM GROUP */
.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

.form-group input{
    width:100%;
    padding:15px 18px;
    border:1px solid #e2e8f0;
    border-radius:14px;
    background:#f8fafc;
    outline:none;
    transition:.3s;
}

.form-group input:focus{
    border-color:#d97706;
    box-shadow:0 0 0 4px rgba(217,119,6,.08);
    background:#fff;
}

/* OPTIONS */
.login-options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.login-options a{
    color:#d97706;
    text-decoration:none;
}

/* BUTTON */
.login-form button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#d97706,#f59e0b);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-form button:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 30px rgba(217,119,6,.25);
}

/* RESPONSIVE */
@media(max-width:900px){
    .login-container{
        grid-template-columns:1fr;
    }

    .login-left{
        display:none;
    }

    .login-right{
        padding:40px 25px;
    }
}
</style>

<section class="login-page">

    <div class="login-container">

        <div class="login-left">
            <h1>Welcome Back</h1>
            <p>
                Login to access your MR DATAFORGE admin dashboard and manage
                courses, students, enquiries, and website content.
            </p>

            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=80" alt="Login">
        </div>

        <div class="login-right">

            <form class="login-form" method="post">
                {% csrf_token %}

                <h2>Admin Login</h2>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="username" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password">
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox"> Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login Now</button>
            </form>

        </div>

    </div>

</section>
