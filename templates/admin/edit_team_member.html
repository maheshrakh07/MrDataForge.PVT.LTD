<style> 
    /* =========================
   FORM CONTAINER
========================= */
.course-form{
    width:100%;
    background:#fff;
    padding:30px;
    border-radius:24px;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    border:1px solid #edf2f7;
    font-family:'Poppins',sans-serif;
    margin-top:30px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

/* =========================
   HEADING
========================= */
.course-form h2{
    grid-column:1 / -1;
    font-size:28px;
    color:#0f172a;
    margin-bottom:10px;
}

/* =========================
   FORM GROUP
========================= */
.form-group{
    display:flex;
    flex-direction:column;
}

/* FULL WIDTH FIELD */
.form-group.full-width{
    grid-column:1 / -1;
}

/* =========================
   LABEL
========================= */
.form-group label{
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:8px;
}

/* =========================
   INPUTS / TEXTAREA / SELECT
========================= */
.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:14px 16px;
    border:1px solid #e2e8f0;
    border-radius:14px;
    background:#f8fafc;
    outline:none;
    transition:.3s;
    font-size:14px;
    font-family:'Poppins',sans-serif;
}

/* =========================
   FOCUS STATE
========================= */
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#d97706;
    background:#fff;
    box-shadow:0 0 0 4px rgba(217,119,6,.08);
}

/* =========================
   TEXTAREA
========================= */
.form-group textarea{
    min-height:140px;
    resize:vertical;
}

/* =========================
   FILE INPUT
========================= */
.form-group input[type="file"]{
    padding:10px;
    background:#fff;
}

/* =========================
   BUTTON
========================= */
.course-form button{
    grid-column:1 / -1;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#d97706,#f59e0b);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 12px 25px rgba(217,119,6,.15);
}

.course-form button:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 30px rgba(217,119,6,.25);
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:1200px){
    .course-form{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:768px){
    .course-form{
        grid-template-columns:1fr;
        padding:20px;
    }

    .course-form h2,
    .course-form button,
    .form-group.full-width{
        grid-column:auto;
    }
}
/* TABLE WRAPPER */
.table-wrapper{
    width:100%;
    margin-top:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    background:#fff;
    overflow:hidden;
}

/* TABLE */
.table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    font-family:'Poppins',sans-serif;
    background:#fff;
}

/* HEADER */
.table thead{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
}

.table th{
    padding:16px;
    text-align:left;
    font-size:14px;
    font-weight:600;
    word-wrap:break-word;
}

/* BODY */
.table td{
    padding:16px;
    border-bottom:1px solid #f1f5f9;
    color:#334155;
    font-size:14px;
    vertical-align:middle;
    word-wrap:break-word;
    white-space:normal;
}

/* IMAGE */
.table img{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:12px;
}

/* HOVER */
.table tbody tr:hover{
    background:#fff7ed;
}
</style>
<form method="post" action="/admin/update_team_member/{{ team_member.id }}/" enctype="multipart/form-data" class="course-form">
    {% csrf_token %}
    <h2>Edit Team Member</h2>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ team_member.name }}" required>
    </div>
    <div class="form-group">
        <label for="mobile">Mobile:</label>
        <input type="text" id="mobile" name="mobile" value="{{ team_member.mobile }}" required>
    </div>
  
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ team_member.email }}" required>
        </div>
    <div class="form-group">
        <label for="position">Position:</label>
        <input type="text" id="position" name="position" value="{{ team_member.position }}" required>
    </div>
    <div class="form-group">
        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio" rows="4" required>{{ team_member.bio }}</textarea>
    </div>
   
    <div class="form-group">
        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*">
    </div>
     
    <div class="form-group">
        <label for="facebook_link">Facebook Link:</label>
        <input type="url" id="facebook_link" name="facebook_link" value="{{ team_member.facebook_link }}">
    </div>

   
    <div class="form-group">
        <label for="linkedin_link">LinkedIn Link:</label>
        <input type="url" id="linkedin_link" name="linkedin_link" value="{{ team_member.linkedin_link }}">  
    </div>
    <div class="form-group">
        <label for="instagram_link">Instagram Link:</label>
        <input type="url" id="instagram_link" name="instagram_link" value="{{ team_member.instagram_link }}">
    </div>

    <div class="form-group">
        <label for="salary">Salary:</label>
        <input type="number" id="salary" name="salary" value="{{ team_member.salary }}" step="0.01" required>    
    </div>
  
    <div class="form-group">
        <label for="qualifications">Qualifications:</label>
        <textarea id="qualifications" name="qualification" rows="4" required>{{ team_member.qualification }}</textarea>   
    </div>
    <div class="form-group">
        <label for="experience">Experience:</label>
        <textarea id="experience" name="experience" rows="4" required>{{ team_member.experience }}</textarea>
    </div>
  
    <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" value="{{ team_member.dob }}" required>    
    </div>
  
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" value="{{ team_member.password }}"  required>
    </div>


    <button type="submit">Add Team Member</button>
</form>
