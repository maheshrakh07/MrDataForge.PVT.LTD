{% include "admin/navbar.html"%}
<style>
    .registration-table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    font-family:'Poppins',sans-serif;
}

/* HEADER */
.registration-table thead{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
}

.registration-table th{
    padding:18px 20px;
    text-align:left;
    font-size:14px;
    font-weight:600;
    letter-spacing:.5px;
}

/* BODY */
.registration-table td{
    padding:18px 20px;
    border-bottom:1px solid #f1f5f9;
    color:#334155;
    font-size:14px;
}

/* ROW HOVER */
.registration-table tbody tr{
    transition:.3s;
}

.registration-table tbody tr:hover{
    background:#fff7ed;
    transform:scale(1.01);
}

/* ZEBRA STRIPES */
.registration-table tbody tr:nth-child(even){
    background:#f8fafc;
}

/* FIRST/LAST RADIUS */
.registration-table thead tr th:first-child{
    border-top-left-radius:20px;
}

.registration-table thead tr th:last-child{
    border-top-right-radius:20px;
}

/* RESPONSIVE WRAPPER */
.table-wrapper{
    width:100%;
    overflow-x:auto;
    border-radius:20px;
}
</style>

<table class="registration-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Course</th>
            <th>Passing Year</th>
        </tr>
    </thead>
    <tbody>
        {% for registration in reg_list %}
        <tr>
            <td>{{ registration.id }}</td>
            <td>{{ registration.name }}</td>
            <td>{{ registration.mobile }}</td>
            <td>{{ registration.course }}</td>
            <td>{{ registration.passing_year }}</td>
        </tr>
        {% endfor %}
    </tbody>

</table>
{% include "admin/footer.html"%}
