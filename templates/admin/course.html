{% include "admin/navbar.html" %}
<style>
   /* FORM CONTAINER */
form{
    width:100%;
    max-width:100%;
    height:500px;
    margin:30px 0;
    background:#fff;
    padding:30px;
    border-radius:24px;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    border:1px solid #edf2f7;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

    overflow-y:auto;
}

/* FORM GROUP */
.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:0;
}

/* FULL WIDTH FIELD */
.form-group.full-width{
    grid-column:1 / -1;
}

/* LABEL */
.form-group label{
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:8px;
}

/* INPUTS */
.form-group input,
.form-group textarea{
    width:100%;
    padding:14px 16px;
    border:1px solid #e2e8f0;
    border-radius:14px;
    background:#f8fafc;
    outline:none;
    transition:.3s;
}

/* FOCUS */
.form-group input:focus,
.form-group textarea:focus{
    border-color:#d97706;
    background:#fff;
    box-shadow:0 0 0 4px rgba(217,119,6,.08);
}

/* TEXTAREA */
.form-group textarea{
    min-height:30px;
    resize:vertical;
}

/* BUTTON */
.btn-primary{
    grid-column:1 / -1;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#d97706,#f59e0b);
    color:#fff;
    font-weight:600;
    cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:1200px){
    form{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:768px){
    form{
        grid-template-columns:1fr;
        height:auto;
    }
}
</style>


      <form action="/admin/save_course/" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
          <label for="course_name">Course Name</label>
          <input type="text" id="course_name" name="course_name" required>
        </div>
        <div class="form-group">
          <label for="course_description">Description</label>
          <textarea id="course_description" name="course_description"></textarea>
        </div>
        
        <div class="form-group">
          <label for="course_price">Price</label>
          <input type="number" id="course_price" name="course_price" required>
        </div>
    
        <div class="form-group">
          <label for="course_duration">Duration (in months)</label>
          <input type="number" id="course_duration" name="course_duration" required>
        </div>
        
        <div class="form-group">
          <label for="course_image">Course Image </label>
          <input type="file" id="course_image" name="course_image">
        </div>
        
        <div class="form-group">
          <label for="course_key_points">Key Points 1 </label>
          <input type="text" id="course_key_points" name="key_point_1">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 2 </label>
          <input type="text" id="course_key_points" name="key_point_2">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 3 </label>
          <input type="text" id="course_key_points" name="key_point_3">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 4 </label>
          <input type="text" id="course_key_points" name="key_point_4">
        </div>
        <div class="form-group">
          <label for="course_key_points">Key Points 5 </label>
          <input type="text" id="course_key_points" name="key_point_5">
        </div>
        <button type="submit" class="btn btn-primary">Add Course</button>
      </form>


    <style>
/* =========================
   TABLE WRAPPER
========================= */
.table-wrapper{
    width:100%;
    max-width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    margin-top:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    background:#fff;
    scroll-behavior:smooth;
}

/* Custom Horizontal Scrollbar */
.table-wrapper::-webkit-scrollbar{
    height:10px;
}

.table-wrapper::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-radius:10px;
}

.table-wrapper::-webkit-scrollbar-thumb{
    background:#d97706;
    border-radius:10px;
}

/* =========================
   TABLE
========================= */
.registration-table{
    width:100%;
    min-width:1600px;
    border-collapse:collapse;
    background:#fff;
    font-family:'Poppins',sans-serif;
}

/* =========================
   TABLE HEADER
========================= */
.registration-table thead{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
    position:sticky;
    top:0;
    z-index:5;
}

.registration-table th{
    padding:18px 20px;
    text-align:left;
    font-size:14px;
    font-weight:600;
    letter-spacing:.4px;
    white-space:nowrap;
}

/* Rounded Header Corners */
.registration-table thead th:first-child{
    border-top-left-radius:20px;
}

.registration-table thead th:last-child{
    border-top-right-radius:20px;
}

/* =========================
   TABLE BODY
========================= */
.registration-table td{
    padding:18px 20px;
    border-bottom:1px solid #f1f5f9;
    color:#334155;
    font-size:14px;
    vertical-align:middle;
    white-space:nowrap;
}

/* Zebra Rows */
.registration-table tbody tr:nth-child(even){
    background:#f8fafc;
}

/* Hover Effect */
.registration-table tbody tr{
    transition:.3s;
}

.registration-table tbody tr:hover{
    background:#fff7ed;
}

/* =========================
   IMAGE STYLING
========================= */
.registration-table img{
    width:90px;
    height:60px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #e2e8f0;
}

/* =========================
   ACTION BUTTONS (OPTIONAL)
========================= */
.table-actions{
    display:flex;
    gap:10px;
}

.edit-btn,
.delete-btn{
    padding:8px 14px;
    border-radius:10px;
    font-size:13px;
    text-decoration:none;
    color:#fff;
    font-weight:500;
    transition:.3s;
}

.edit-btn{
    background:#10b981;
}

.delete-btn{
    background:#ef4444;
}

.edit-btn:hover,
.delete-btn:hover{
    transform:translateY(-2px);
    opacity:.9;
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:768px){
    .registration-table th,
    .registration-table td{
        padding:14px 16px;
        font-size:13px;
    }

    .registration-table img{
        width:70px;
        height:50px;
    }
}
/* CONTENT AREA */
.main-content{
    margin-left:290px;
    width:calc(100% - 290px);
    padding:20px;
    overflow-x:hidden;
}

/* TABLE WRAPPER */
.table-wrapper{
    width:100%;
    max-width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    display:block;
    margin-top:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.05);
    background:#fff;
}

/* TABLE */
.registration-table{
    width:max-content;
    min-width:100%;
    border-collapse:collapse;
    background:#fff;
}
</style>
      <table class="registration-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Duration</th>
            <th>Image</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for course in courses %}
        <tr>
            <td>{{ course.id }}</td>
            <td>{{ course.name }}</td>
            <td>{{ course.description }}</td>
            <td>${{ course.price }}</td>
            <td>{{ course.duration }}</td>
            <td><img src="{{ course.image.url }}" alt="{{ course.name }}" width="100"></td>
            <td class="table-actions">
                <a href="{% url 'edit_course' course.id %}" class="edit-btn">Edit</a>
                <a href="{% url 'delete_course' course.id %}" class="delete-btn">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
